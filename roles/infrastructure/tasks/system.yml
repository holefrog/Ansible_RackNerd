---
# roles/infrastructure/tasks/system.yml
# 系统初始化与基础维护工具配置

- name: Upgrade all system packages   # noqa: package-latest
  ansible.builtin.apt:
    name: "*"
    state: latest
    update_cache: true

- name: Install basic maintenance tools
  ansible.builtin.apt:
    name:
      - jq
      - cron
      - tar
      - wget
      - curl
      - kitty-terminfo
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Deploy custom logrotate rules
  ansible.builtin.copy:
    dest: /etc/logrotate.d/racknerd_custom
    content: |
      /var/log/aria2/*.log /var/log/xray/*.log {
          daily
          rotate 7
          compress
          missingok
          notifempty
          size 50M
          su {{ web_user | default('www-data') }} {{ web_user | default('www-data') }}
      }
    mode: '0644'

- name: 全局配置自定义别名
  ansible.builtin.copy:
    dest: /etc/profile.d/custom_aliases.sh
    content: |
      alias ll='ls -l -tr'
    mode: '0644'
