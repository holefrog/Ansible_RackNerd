---
- name: 🚀 RackNerd VPS 企业级自动化部署
  hosts: racknerd
  become: true
  # 【⚠️ 核心架构警告】：切勿开启默认的 gather_facts！
  # 必须保持 gather_facts: false。先用 raw 模块修复 python3-apt 基础环境，再显式收集 facts，防止缺少依赖时崩溃。
  gather_facts: false

  pre_tasks:
    - name: 智能探测目标主机的自定义 SSH 端口 (防 22 端口死锁)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ssh_port }}"
        timeout: 3
        state: started
      delegate_to: localhost
      register: custom_port_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: 动态设置实际连接端口 (根据探测结果 fallback 到 22)
      ansible.builtin.set_fact:
        ansible_port: "{% if 'Timeout' not in custom_port_check.msg | default('') %}{{ ssh_port }}{% else %}22{% endif %}"

    - name: Ensure Python 3 APT bindings are installed (fixes old Python issue on target)
      ansible.builtin.raw: "apt-get update && apt-get install -y python3-apt || true"
      changed_when: false
      failed_when: false

    # 【⚠️ 核心架构警告】：切勿删除此手动 setup 任务！
    # 因为我们在顶部禁用了默认的 gather_facts，所以必须在 python 基础环境准备好之后，
    # 显式地调用 setup 模块来收集系统信息（如 IP、系统版本等），否则后续的 Roles 会因缺少变量而报错。
    - name: Gather facts after python environment is ready
      ansible.builtin.setup:

  # 必须通过 roles 关键字挂载任务角色
  roles:
    - security          # 执行 UFW 防火墙与 SSH 22122 高位硬化 (闭环切断22)
    - infrastructure    # 执行系统更新、BBR/Swap、自动安全更新、Nginx、DDNS
    - application       # 执行 Aria2 与 WebDAV 服务部署
    - vpn               # 执行 Xray (VLESS+Reality) 安装与 SNI 分流配置

  tasks:
    - name: 打印部署完成状态
      ansible.builtin.debug:
        msg: "🎉 节点 [{{ inventory_hostname }}] 自动化部署完成！SSH 端口: {{ ssh_port }}，业务域名: {{ domain }}"
